name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Lint Tools
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        run: pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME_API }}/web
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release Heroku Container
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku stack:set container --app ${{ secrets.HEROKU_APP_NAME_API }}
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME_API }} || {
            echo "========================================="
            echo "Release failed! Fetching Heroku release logs..."
            echo "========================================="
            heroku releases --app ${{ secrets.HEROKU_APP_NAME_API }} -n 5
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_API }} -n 100
            exit 1
          }

      - name: Health Check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Waiting for dyno to fully start..."
          sleep 30
          echo "Checking dyno status..."
          heroku ps --app ${{ secrets.HEROKU_APP_NAME_API }}
          HEROKU_APP_URL=$(heroku apps:info --app ${{ secrets.HEROKU_APP_NAME_API }} | grep -i "web_url" | awk '{print $2}')
          if [ -z "$HEROKU_APP_URL" ]; then
            HEROKU_APP_URL="https://${{ secrets.HEROKU_APP_NAME_API }}.herokuapp.com/"
          fi
          echo "Checking health endpoint at: ${HEROKU_APP_URL}health"

          for i in 1 2 3; do
            echo "Attempt $i/3..."
            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" "${HEROKU_APP_URL}health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i failed with HTTP $HTTP_CODE. Waiting 20s before retry..."
            sleep 20
          done

          echo "Health check failed after 3 attempts!"
          heroku logs --app ${{ secrets.HEROKU_APP_NAME_API }} -n 100
          exit 1
